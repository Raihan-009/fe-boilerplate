name: CI/CD Pipeline [GitOps]

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main, 'feature/*' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Set up QEMU (for multi-arch builds)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 5: Build and push multi-arch Docker image
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:v1.0.${{ github.run_number }}

      # Step 6: Update image tag in GitOps repository
      - name: Update ArgoCD Deployment Repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          NEW_TAG: v1.0.${{ github.run_number }}
        run: |
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          
          rm -rf argocd-deployments
          git clone https://github.com/Raihan-009/argocd-deployments.git
          cd argocd-deployments/minikube-deployment/boilerplate

          
          sed -i "s|image: ${DOCKER_IMAGE}:.*|image: ${DOCKER_IMAGE}:${NEW_TAG}|g" deployment.yml

          
          git add deployment.yml
          git commit -m "Update boilerplate image tag to ${NEW_TAG}"
          git push https://${GITOPS_PAT}@github.com/Raihan-009/argocd-deployments.git main
